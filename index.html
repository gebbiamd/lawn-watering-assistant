// ---------------------------------------------------------------------
// Data loading
// ---------------------------------------------------------------------
async function loadSettings() {
  const { data, error } = await supabase.from('lawn_settings').select('*').eq('id', 1).maybeSingle();
  if (error) console.error(error);
  return data;
}

async function fetchWeather(lat, lon) {
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
    `&hourly=precipitation` +
    `&daily=precipitation_sum,weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max` +
    `&current=temperature_2m,weather_code` +
    `&temperature_unit=fahrenheit&precipitation_unit=inch&past_days=${PAST_DAYS}&forecast_days=${FORECAST_DAYS}&timezone=auto`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('Weather fetch failed');
  return res.json();
}

async function loadLogs() {
  const since = new Date(Date.now() - 8 * 24 * 3600 * 1000).toISOString();
  const { data, error } = await supabase
    .from('water_logs')
    .select('*')
    .gte('created_at', since)
    .order('created_at', { ascending: false });
  if (error) { console.error(error); return []; }
  return data;
}

async function loadRecentAlerts() {
  const { data, error } = await supabase
    .from('alert_history')
    .select('*')
    .order('sent_at', { ascending: false })
    .limit(3);
  if (error) return [];
  return data || [];
}

// ---------------------------------------------------------------------
// Phase engine
// ---------------------------------------------------------------------
function getPhase(settings) {
  const seedDate = new Date(settings.seed_date + 'T00:00:00');
  const daysSince = Math.floor((Date.now() - seedDate.getTime()) / (24 * 3600 * 1000));
  let phase = 3;
  if (daysSince < settings.phase1_end_day) phase = 1;
  else if (daysSince < settings.phase2_end_day) phase = 2;
  return { daysSince: Math.max(daysSince, 0), phase };
}

function localDateStr(d = new Date()) {
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

function getTodayIdx(weather) {
  const idx = weather.daily.time.indexOf(localDateStr());
  return idx === -1 ? Math.max(0, weather.daily.time.length - FORECAST_DAYS) : idx;
}

function sumHourly(weather, hours) {
  const times = weather.hourly.time;
  const precip = weather.hourly.precipitation;
  const now = Date.now();
  let nowIdx = times.length - 1;
  for (let i = 0; i < times.length; i++) {
    if (new Date(times[i]).getTime() > now) { nowIdx = i - 1; break; }
  }
  let sum = 0;
  for (let i = Math.max(0, nowIdx - hours + 1); i <= nowIdx; i++) sum += precip[i] || 0;
  return sum;
}

function sumDailyRange(weather, endIdx, days) {
  const vals = weather.daily.precipitation_sum;
  const start = Math.max(0, endIdx - days + 1);
  return vals.slice(start, endIdx + 1).reduce((a, b) => a + (b || 0), 0);
}

function sumDailyForward(weather, startIdx, days) {
  const vals = weather.daily.precipitation_sum;
  const end = Math.min(vals.length - 1, startIdx + days - 1);
  if (startIdx > end) return 0;
  return vals.slice(startIdx, end + 1).reduce((a, b) => a + (b || 0), 0);
}

function sumLogs(logs, hours, types = ['rain', 'irrigation']) {
  const cutoff = Date.now() - hours * 3600 * 1000;
  return logs
    .filter(l => types.includes(l.type) && new Date(l.created_at).getTime() >= cutoff)
    .reduce((a, l) => a + l.amount_inches, 0);
}

function computeMetrics(settings, weather, logs, todayIdx) {
  const rain8h = sumHourly(weather, MOISTURE_LOOKBACK_HOURS);
  const rain24h = sumHourly(weather, 24);
  const rain48h = sumHourly(weather, 48);
  const rainWeek = sumDailyRange(weather, todayIdx, 7);
  const forecastToday = weather.daily.precipitation_sum[todayIdx] || 0;
  const forecastProbability = weather.daily.precipitation_probability_max?.[todayIdx] ?? 100;

  const logs8h = sumLogs(logs, 8);
  const logs24h = sumLogs(logs, 24);
  const logs48h = sumLogs(logs, 48);
  const logsWeek = sumLogs(logs, 24 * 7);

  return {
    forecastToday,
    forecastProbability,
    combined8h: rain8h + logs8h,
    combined24h: rain24h + logs24h,
    combined48h: rain48h + logs48h,
    combinedWeek: rainWeek + logsWeek,
    rain24h,
  };
}

// Urgency (water_now / water_soon / on_track) always comes from the same
// pct/overdue signal as the moisture gauge — computeMoistureLevel below —
// so the banner and the gauge can never disagree. Phase only changes the
// *detail* wording (what "watering" means at this stage), not the urgency.
function computeStatus(settings, phaseInfo, metrics, schedule) {
  const { phase } = phaseInfo;

  if (metrics.forecastToday > RAIN_FORECAST_THRESHOLD && metrics.forecastProbability >= RAIN_PROBABILITY_GATE_PCT) {
    return { key: 'skip_rain', detail: `${metrics.forecastToday.toFixed(2)}" of rain forecasted today (${Math.round(metrics.forecastProbability)}% chance).` };
  }
  if (metrics.combined48h > SATURATION_48H_THRESHOLD) {
    const skipHours = metrics.combined48h > 1.0 ? 48 : 24;
    return { key: 'skip_saturated', detail: `${metrics.combined48h.toFixed(2)}" received in the last 48h. Re-check in ${skipHours}h.` };
  }

  const { pct, overdueHours } = computeMoistureLevel(schedule);
  const urgency = overdueHours > 0
    ? (overdueHours > schedule.intervalHours * 0.5 ? 'critical' : 'now')
    : (pct < URGENCY_SOON_PCT ? 'soon' : 'ok');

  if (phase === 1) {
    if (urgency === 'critical' || urgency === 'now') {
      return { key: urgency === 'critical' ? 'water_now_critical' : 'water_now', detail: 'Keep the top ½" of soil moist — short 5–10 min mist now.' };
    }
    if (urgency === 'soon') {
      return { key: 'water_soon', detail: `Top layer is starting to dry — mist again ${formatNextDue(schedule.nextDueAt)}.` };
    }
    return { key: 'on_track', detail: `Soil moist — ${metrics.combined8h.toFixed(2)}" in the last ${MOISTURE_LOOKBACK_HOURS}h.` };
  }

  if (phase === 2) {
    const dailyTarget = settings.root_dev_weekly_inches / 7;
    if (urgency === 'critical' || urgency === 'now') {
      return { key: urgency === 'critical' ? 'water_now_critical' : 'water_now', detail: `${metrics.combined24h.toFixed(2)}" today so far — target ${dailyTarget.toFixed(2)}", time for a deeper session.` };
    }
    if (urgency === 'soon') {
      return { key: 'water_soon', detail: `Approaching today's watering window — due ${formatNextDue(schedule.nextDueAt)}.` };
    }
    return { key: 'on_track', detail: `${metrics.combined24h.toFixed(2)}" today so far — on pace for ${settings.root_dev_weekly_inches}"/wk.` };
  }

  // phase 3 — establishment
  const deficit = Math.max(0, settings.weekly_target_inches - metrics.combinedWeek);
  if (urgency === 'critical' || urgency === 'now') {
    return { key: urgency === 'critical' ? 'water_now_critical' : 'water_now', detail: `${deficit.toFixed(2)}" still needed this week (${metrics.combinedWeek.toFixed(2)}" / ${settings.weekly_target_inches}").` };
  }
  if (urgency === 'soon') {
    return { key: 'water_soon', detail: `Approaching this week's watering window — due ${formatNextDue(schedule.nextDueAt)}.` };
  }
  return { key: 'on_track', detail: `${metrics.combinedWeek.toFixed(2)}" of ${settings.weekly_target_inches}" this week.` };
}

// ---------------------------------------------------------------------
// Frequency + amount schedule — when is the *next* session actually due,
// and how much should it be. Complements computeStatus (which only answers
// "act right now or not") with the timing/amount half of the picture.
// ---------------------------------------------------------------------
function computeLastWetAt(weather, logs) {
  const times = weather.hourly.time;
  const precip = weather.hourly.precipitation;
  const now = Date.now();
  let lastRain = null;
  for (let i = times.length - 1; i >= 0; i--) {
    const t = new Date(times[i]).getTime();
    if (t > now) continue;
    if ((precip[i] || 0) >= 0.01) { lastRain = t; break; }
  }
  const lastLog = logs.length ? new Date(logs[0].created_at).getTime() : null; // logs are sorted desc
  const candidates = [lastRain, lastLog].filter(v => v !== null);
  return candidates.length ? new Date(Math.max(...candidates)) : null;
}

function computeSchedule(settings, phaseInfo, weather, logs) {
  const lastWetAt = computeLastWetAt(weather, logs);
  let intervalHours, sessionAmountInches;

  if (phaseInfo.phase === 1) {
    intervalHours = 24 / settings.germination_sessions_per_day;
    sessionAmountInches = MOISTURE_LOOKBACK_THRESHOLD;
  } else if (phaseInfo.phase === 2) {
    const span = Math.max(1, settings.phase2_end_day - settings.phase1_end_day);
    const t = Math.min(1, Math.max(0, (phaseInfo.daysSince - settings.phase1_end_day) / span));
    const startHours = 24;
    const endHours = settings.establishment_interval_days * 24;
    intervalHours = startHours + t * (endHours - startHours);
    sessionAmountInches = settings.root_dev_weekly_inches * (intervalHours / 168);
  } else {
    intervalHours = settings.establishment_interval_days * 24;
    sessionAmountInches = settings.weekly_target_inches * (intervalHours / 168);
  }

  const nextDueAt = lastWetAt
    ? new Date(lastWetAt.getTime() + intervalHours * 3600 * 1000)
    : new Date();
  return { intervalHours, sessionAmountInches, lastWetAt, nextDueAt };
}

function formatDuration(hours) {
  if (hours < 1) return `${Math.max(1, Math.round(hours * 60))}m`;
  const h = Math.floor(hours);
  const m = Math.round((hours - h) * 60);
  return `${h}h${m ? ' ' + m + 'm' : ''}`;
}

// Answers "WHEN" concretely: a clock time, plus a relative countdown for
// anything happening soon, and an explicit overdue duration once it's passed.
function formatNextDue(date) {
  const now = new Date();
  const diffMs = date.getTime() - now.getTime();

  if (diffMs <= 0) {
    return `overdue by ${formatDuration(Math.abs(diffMs) / 3600000)}`;
  }

  const timeStr = date.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
  const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const startOfTarget = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  const diffDays = Math.round((startOfTarget - startOfToday) / 86400000);

  let dayLabel;
  if (diffDays === 0) dayLabel = 'Today';
  else if (diffDays === 1) dayLabel = 'Tomorrow';
  else if (diffDays <= 6) dayLabel = date.toLocaleDateString(undefined, { weekday: 'long' });
  else dayLabel = date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });

  if (diffMs < 36 * 3600 * 1000) {
    return `${dayLabel} at ${timeStr} (in ${formatDuration(diffMs / 3600000)})`;
  }
  return `${dayLabel} at ${timeStr}`;
}

function formatAmount(inches, ratePerHour) {
  const rate = ratePerHour || 0.5;
  const mins = Math.max(1, Math.round((inches / rate) * 60));
  return `${inches.toFixed(2)}" (≈${mins} min)`;
}

function buildNotifications(settings, phaseInfo, metrics, status, recentAlerts, weather, todayIdx, schedule) {
  const items = [];
  const meta = STATUS_META[status.key];
  items.push(`${meta.emoji} ${meta.label} — ${status.detail} Next: ${formatNextDue(schedule.nextDueAt)} — ${formatAmount(schedule.sessionAmountInches, settings.sprinkler_rate_inches_per_hour)}.`);

  if (metrics.forecastToday > RAIN_FORECAST_THRESHOLD && status.key !== 'skip_rain') {
    items.push(`🌧️ Heads up: ${metrics.forecastToday.toFixed(2)}" of rain still forecasted later today.`);
  }
  if (metrics.combined48h > SATURATION_48H_THRESHOLD && status.key !== 'skip_saturated') {
    items.push(`⚠️ ${metrics.combined48h.toFixed(2)}" detected in the last 48h.`);
  }

  const upcoming = sumDailyForward(weather, todayIdx + 1, 3);
  if (upcoming > 0.1) {
    items.push(`🔮 ${upcoming.toFixed(2)}" more rain expected over the next 3 days — factored into the trend chart below.`);
  }

  const nextCutoff = phaseInfo.phase === 1 ? settings.phase1_end_day : phaseInfo.phase === 2 ? settings.phase2_end_day : null;
  if (nextCutoff !== null) {
    const daysLeft = nextCutoff - phaseInfo.daysSince;
    if (daysLeft >= 0 && daysLeft <= 3) {
      const nextPhaseName = phaseInfo.phase === 1 ? 'Root Development' : 'Establishment';
      items.push(`📅 Entering ${nextPhaseName} phase in ${daysLeft} day${daysLeft === 1 ? '' : 's'}.`);
    }
  }

  for (const a of recentAlerts) {
    items.push(`📧 Emailed alert: ${a.status_text} (${relativeTime(a.sent_at)})`);
  }
  return items;
}

// ---------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------
function relativeTime(iso) {
  const diffMs = Date.now() - new Date(iso).getTime();
  const mins = Math.round(diffMs / 60000);
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return `${hrs}h ago`;
  return `${Math.round(hrs / 24)}d ago`;
}

function phaseName(phase) {
  return phase === 1 ? 'Germination' : phase === 2 ? 'Root Development' : 'Establishment';
}

function toDatetimeLocal(date) {
  const pad = n => String(n).padStart(2, '0');
  return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
}

function renderSetup(prefill) {
  root.innerHTML = '';
  root.appendChild(document.getElementById('tpl-setup').content.cloneNode(true));

  const grassSel = document.getElementById('in-grass-type');
  const p1 = document.getElementById('in-phase1-end');
  const p2 = document.getElementById('in-phase2-end');
  const rootTarget = document.getElementById('in-root-target');
  const weeklyTarget = document.getElementById('in-weekly-target');
  const germSessions = document.getElementById('in-germ-sessions');
  const establishInterval = document.getElementById('in-establish-interval');
  const sprinklerRate = document.getElementById('in-sprinkler-rate');
  sprinklerRate.value = 0.5;

  function applyPreset(key) {
    const p = GRASS_PRESETS[key];
    p1.value = p.phase1_end_day;
    p2.value = p.phase2_end_day;
    rootTarget.value = p.root_dev_weekly_inches;
    weeklyTarget.value = p.weekly_target_inches;
    germSessions.value = p.germination_sessions_per_day;
    establishInterval.value = p.establishment_interval_days;
  }

  const s = prefill || {};
  grassSel.value = s.grass_type || 'kentucky_bluegrass';
  applyPreset(grassSel.value);
  if (s.seed_date) document.getElementById('in-seed-date').value = s.seed_date;
  if (s.phase1_end_day) p1.value = s.phase1_end_day;
  if (s.phase2_end_day) p2.value = s.phase2_end_day;
  if (s.root_dev_weekly_inches) rootTarget.value = s.root_dev_weekly_inches;
  if (s.weekly_target_inches) weeklyTarget.value = s.weekly_target_inches;
  if (s.germination_sessions_per_day) germSessions.value = s.germination_sessions_per_day;
  if (s.establishment_interval_days) establishInterval.value = s.establishment_interval_days;
  if (s.sprinkler_rate_inches_per_hour) sprinklerRate.value = s.sprinkler_rate_inches_per_hour;
  if (s.latitude) document.getElementById('in-lat').value = s.latitude;
  if (s.longitude) document.getElementById('in-lon').value = s.longitude;
  if (s.alert_email) document.getElementById('in-email').value = s.alert_email;

  grassSel.addEventListener('change', () => applyPreset(grassSel.value));

  document.getElementById('btn-use-location').addEventListener('click', () => {
    if (!navigator.geolocation) return alert('Geolocation not supported on this browser.');
    navigator.geolocation.getCurrentPosition(
      pos => {
        document.getElementById('in-lat').value = pos.coords.latitude.toFixed(5);
        document.getElementById('in-lon').value = pos.coords.longitude.toFixed(5);
      },
      err => alert('Could not get location: ' + err.message)
    );
  });

  document.getElementById('btn-save-setup').addEventListener('click', async () => {
    const errEl = document.getElementById('setup-error');
    errEl.classList.add('hidden');
    const seedDate = document.getElementById('in-seed-date').value;
    const lat = parseFloat(document.getElementById('in-lat').value);
    const lon = parseFloat(document.getElementById('in-lon').value);
    if (!seedDate || isNaN(lat) || isNaN(lon)) {
      errEl.textContent = 'Seed date and location (lat/lon) are required.';
      errEl.classList.remove('hidden');
      return;
    }
    const payload = {
      id: 1,
      seed_date: seedDate,
      grass_type: grassSel.value,
      phase1_end_day: parseInt(p1.value, 10),
      phase2_end_day: parseInt(p2.value, 10),
      weekly_target_inches: parseFloat(weeklyTarget.value),
      root_dev_weekly_inches: parseFloat(rootTarget.value),
      germination_sessions_per_day: parseInt(germSessions.value, 10),
      establishment_interval_days: parseFloat(establishInterval.value),
      sprinkler_rate_inches_per_hour: parseFloat(sprinklerRate.value) || 0.5,
      latitude: lat,
      longitude: lon,
      alert_email: document.getElementById('in-email').value || null,
      updated_at: new Date().toISOString(),
    };
    const { error } = await supabase.from('lawn_settings').upsert(payload);
    if (error) {
      errEl.textContent = 'Save failed: ' + error.message;
      errEl.classList.remove('hidden');
      return;
    }
    state.settings = payload;
    await refreshAll();
  });
}

function renderApp() {
  root.innerHTML = '';
  root.appendChild(document.getElementById('tpl-app').content.cloneNode(true));
  document.getElementById('btn-settings').addEventListener('click', () => renderSetup(state.settings));
  document.getElementById('btn-fab').addEventListener('click', () => openModal());

    if (!('Notification' in window)) return alert('Notifications not supported on this browser.');
    await Notification.requestPermission();
  });
}

function renderDashboard(settings, phaseInfo, metrics, status, schedule) {
  document.getElementById('phase-label').textContent = `Day ${phaseInfo.daysSince} · ${phaseName(phaseInfo.phase)} Phase`;

  const meta = STATUS_META[status.key];
  const pill = document.getElementById('status-pill');
  pill.className = `rounded-3xl px-4 py-4 flex items-center gap-3 ring-1 shadow-sm ${PILL_CLASSES[meta.color]}`;
  document.getElementById('status-emoji').textContent = meta.emoji;
  document.getElementById('status-label').textContent = meta.label;
  document.getElementById('status-detail').textContent = status.detail;
  document.getElementById('status-next').textContent = `📅 Next watering: ${formatNextDue(schedule.nextDueAt)} — ${formatAmount(schedule.sessionAmountInches, settings.sprinkler_rate_inches_per_hour)}`;

  const cards = document.getElementById('dashboard-cards');
  cards.innerHTML = '';

  function card(title, valueHtml, sub) {
    const div = document.createElement('div');
    div.className = 'card rounded-3xl p-4';
    div.innerHTML = `<div class="text-xs uppercase tracking-wide text-slate-400 font-semibold">${title}</div>
      <div class="text-2xl font-bold mt-1 text-slate-900">${valueHtml}</div>
      ${sub ? `<div class="text-xs text-slate-400 mt-1">${sub}</div>` : ''}`;
    return div;
  }

  if (phaseInfo.phase === 1) {
    cards.appendChild(card('Moisture (8h)', `${metrics.combined8h.toFixed(2)}"`, `Threshold ${MOISTURE_LOOKBACK_THRESHOLD}"`));
  } else if (phaseInfo.phase === 2) {
    const dailyTarget = settings.root_dev_weekly_inches / 7;
    cards.appendChild(card('Today\'s Water', `${metrics.combined24h.toFixed(2)}" <span class="text-sm text-slate-400 font-normal">/ ${dailyTarget.toFixed(2)}"</span>`));
  } else {
    const pct = Math.min(100, Math.round((metrics.combinedWeek / settings.weekly_target_inches) * 100));
    cards.appendChild(card('This Week', `${metrics.combinedWeek.toFixed(2)}" <span class="text-sm text-slate-400 font-normal">/ ${settings.weekly_target_inches}"</span>`,
      `<div class="w-full bg-slate-100 rounded-full h-1.5 mt-2"><div class="bg-emerald-500 h-1.5 rounded-full" style="width:${pct}%"></div></div>`));
  }
  cards.appendChild(card('Rain Past 24h', `${metrics.rain24h.toFixed(2)}"`));
  cards.appendChild(card('Forecast Today', `${metrics.forecastToday.toFixed(2)}"`));
}

function computeMoistureLevel(schedule) {
  if (!schedule.lastWetAt) return { pct: 0, overdueHours: schedule.intervalHours };
  const elapsedHours = (Date.now() - schedule.lastWetAt.getTime()) / 3600000;
  const pct = Math.max(0, Math.min(100, 100 - (elapsedHours / schedule.intervalHours) * 100));
  const overdueHours = Math.max(0, elapsedHours - schedule.intervalHours);
  return { pct, overdueHours };
}

function renderMoistureGauge(schedule) {
  const fill = document.getElementById('moisture-gauge-fill');
  const bulb = document.getElementById('moisture-gauge-bulb');
  const label = document.getElementById('moisture-gauge-label');
  const sub = document.getElementById('moisture-gauge-sub');
  if (!fill) return;

  const { pct, overdueHours } = computeMoistureLevel(schedule);
  const critical = overdueHours > schedule.intervalHours * 0.5;

  let fillColor, bulbColor, labelColor, labelText;
  if (overdueHours > 0) {
    fillColor = 'bg-red-400'; bulbColor = 'bg-red-500'; labelColor = 'text-red-600';
    labelText = critical ? 'Critically Dry' : 'Water Needed';
    sub.textContent = `Overdue by ${formatDuration(overdueHours)}`;
  } else if (pct >= 50) {
    fillColor = 'bg-emerald-400'; bulbColor = 'bg-emerald-500'; labelColor = 'text-emerald-700';
    labelText = 'Moist';
    sub.textContent = `Next watering ${formatNextDue(schedule.nextDueAt)}`;
  } else {
    fillColor = 'bg-amber-400'; bulbColor = 'bg-amber-500'; labelColor = 'text-amber-700';
    labelText = 'Getting Dry';
    sub.textContent = `Next watering ${formatNextDue(schedule.nextDueAt)}`;
  }

  fill.className = `absolute bottom-0 left-0 right-0 rounded-full transition-all duration-700 ease-out ${fillColor}`;
  fill.style.height = `${pct}%`;
  bulb.className = `w-5 h-5 rounded-full -mt-2.5 ring-4 ring-white shrink-0 ${bulbColor} ${critical ? 'pulse-critical' : ''}`;
  label.className = `text-lg font-bold mt-0.5 ${labelColor}`;
  label.textContent = labelText;
}

function renderCurrentConditions(weather) {
  const el = document.getElementById('current-conditions');
  if (!el || !weather.current) return;
  el.textContent = `Now ${Math.round(weather.current.temperature_2m)}° ${weatherIcon(weather.current.weather_code)}`;
}

function renderForecastStrip(weather, todayIdx) {
  const el = document.getElementById('forecast-strip');
  if (!el) return;
  el.innerHTML = '';
  const days = weather.daily.time;
  const hi = weather.daily.temperature_2m_max;
  const lo = weather.daily.temperature_2m_min;
  const pop = weather.daily.precipitation_probability_max;
  const code = weather.daily.weather_code;
  for (let i = todayIdx; i < days.length; i++) {
    const label = i === todayIdx ? 'Today' : new Date(days[i] + 'T00:00:00').toLocaleDateString(undefined, { weekday: 'short' });
    const div = document.createElement('div');
    div.className = 'flex flex-col items-center gap-1 bg-slate-50 rounded-2xl px-3 py-3 min-w-[64px] ring-1 ring-slate-100 shrink-0';
    div.innerHTML = `<div class="text-xs font-semibold text-slate-500">${label}</div>
      <div class="text-2xl">${weatherIcon(code[i])}</div>
      <div class="text-sm font-bold text-slate-800">${Math.round(hi[i])}°</div>
      <div class="text-xs text-slate-400">${Math.round(lo[i])}°</div>
      <div class="text-xs text-sky-600 font-medium">💧${Math.round(pop[i] ?? 0)}%</div>`;
    el.appendChild(div);
  }
}

function computeMoistureSeries(weather, logs, todayIdx) {
  const dates = weather.daily.time;
  const rain = weather.daily.precipitation_sum;
  const loggedByDate = {};
  for (const l of logs) {
    const d = localDateStr(new Date(l.created_at));
    loggedByDate[d] = (loggedByDate[d] || 0) + l.amount_inches;
  }
  let moisture = 0;
  const series = [];
  for (let i = 0; i < dates.length; i++) {
    const input = (rain[i] || 0) + (loggedByDate[dates[i]] || 0);
    moisture = i === 0 ? input : moisture * MOISTURE_DECAY + input;
    series.push(Number(moisture.toFixed(3)));
  }
  return series;
}

function renderMoistureChart(weather, logs, todayIdx) {
  const canvas = document.getElementById('moisture-chart');
  if (!canvas) return;
  const dates = weather.daily.time;
  const series = computeMoistureSeries(weather, logs, todayIdx);
  const rainData = weather.daily.precipitation_sum;
  const labels = dates.map((d, i) => i === todayIdx ? 'Today' : new Date(d + 'T00:00:00').toLocaleDateString(undefined, { weekday: 'short' }));

  if (moistureChart) { moistureChart.destroy(); moistureChart = null; }

  moistureChart = new Chart(canvas.getContext('2d'), {
    data: {
      labels,
      datasets: [
        {
          type: 'bar',
          label: 'Rain (in)',
          data: rainData,
          backgroundColor: CHART_COLOR_RAIN,
          borderRadius: { topLeft: 4, topRight: 4 },
          borderSkipped: 'bottom',
          maxBarThickness: 16,
          order: 2,
        },
        {
          type: 'line',
          label: 'Moisture Index (in)',
          data: series,
          borderColor: CHART_COLOR_MOISTURE,
          backgroundColor: CHART_COLOR_MOISTURE + '1a',
          fill: true,
          tension: 0.3,
          borderWidth: 2,
          pointRadius: 3,
          pointHoverRadius: 6,
          pointBackgroundColor: CHART_COLOR_MOISTURE,
          pointBorderColor: '#ffffff',
          pointBorderWidth: 2,
          segment: { borderDash: ctx => ctx.p1DataIndex > todayIdx ? [6, 4] : undefined },
          order: 1,
        },
      ],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: true, position: 'top', align: 'end', labels: { boxWidth: 14, boxHeight: 2, font: { size: 11 }, color: '#52514e' } },
        tooltip: {
          callbacks: { label: ctx => `${ctx.dataset.label}: ${ctx.parsed.y.toFixed(2)}"` },
        },
      },
      scales: {
        x: { grid: { display: false }, ticks: { color: '#898781', font: { size: 10 } } },
        y: { beginAtZero: true, grid: { color: '#e1e0d9' }, ticks: { color: '#898781', font: { size: 10 } } },
      },
    },
  });
}

function renderNotifications(items) {
  const ul = document.getElementById('notif-list');
  ul.innerHTML = '';
  if (!items.length) {
    ul.innerHTML = '<li class="text-slate-400 text-sm">No alerts right now.</li>';
    return;
  }
  for (const text of items) {
    const li = document.createElement('li');
    li.className = 'bg-slate-50 rounded-xl px-3 py-2 ring-1 ring-slate-100';
    li.textContent = text;
    ul.appendChild(li);
  }
}

function renderHistory(logs) {
  const ul = document.getElementById('history-list');
  ul.innerHTML = '';
  const last5 = logs.slice(0, 5);
  if (!last5.length) {
    ul.innerHTML = '<li class="text-slate-400 text-sm py-2">No entries yet.</li>';
    return;
  }
  for (const l of last5) {
    const li = document.createElement('li');
    li.className = 'py-2.5 flex items-center justify-between gap-2';
    li.innerHTML = `<div class="flex items-center gap-2 min-w-0">
        <span>${l.type === 'rain' ? '🌧️' : '💧'}</span>
        <div class="min-w-0">
          <div class="text-sm font-medium text-slate-800">${l.amount_inches.toFixed(2)}" ${l.type}</div>
          ${l.notes ? `<div class="text-xs text-slate-400 truncate">${escapeHtml(l.notes)}</div>` : ''}
        </div>
      </div>
      <div class="flex items-center gap-2 shrink-0">
        <span class="text-xs text-slate-400">${relativeTime(l.created_at)}</span>
        <button class="edit-entry-btn text-slate-400 hover:text-emerald-600 text-sm px-1" aria-label="Edit entry">✏️</button>
      </div>`;
    li.querySelector('.edit-entry-btn').addEventListener('click', () => openModal(l));
    ul.appendChild(li);
  }
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ---------------------------------------------------------------------
// Modal (create + edit + delete)
// ---------------------------------------------------------------------
let modalType = 'irrigation';
let editingEntry = null;

function openModal(entry = null) {
  document.body.appendChild(document.getElementById('tpl-modal').content.cloneNode(true));
  editingEntry = entry;
  modalType = entry ? entry.type : 'irrigation';
  updateModalTypeButtons();

  document.getElementById('modal-title').textContent = entry ? 'Edit Entry' : 'Log Water';
  document.getElementById('btn-modal-delete').classList.toggle('hidden', !entry);
  document.getElementById('btn-modal-cancel').classList.toggle('hidden', !!entry);

  const amountEl = document.getElementById('in-amount');
  const notesEl = document.getElementById('in-notes');
  const useNowEl = document.getElementById('in-use-now');
  const tsWrap = document.getElementById('timestamp-wrap');
  const tsInput = document.getElementById('in-timestamp');

  if (entry) {
    amountEl.value = entry.amount_inches;
    notesEl.value = entry.notes || '';
    useNowEl.checked = false;
    tsWrap.classList.remove('hidden');
    tsInput.value = toDatetimeLocal(new Date(entry.created_at));
  } else {
    tsInput.value = toDatetimeLocal(new Date());
  }

  useNowEl.addEventListener('change', () => {
    tsWrap.classList.toggle('hidden', useNowEl.checked);
    if (!useNowEl.checked && !tsInput.value) tsInput.value = toDatetimeLocal(new Date());
  });

  document.querySelectorAll('.modal-type-btn').forEach(btn => {
    btn.addEventListener('click', () => { modalType = btn.dataset.type; updateModalTypeButtons(); });
  });

  const minutesEl = document.getElementById('in-minutes');
  const rateEl = document.getElementById('in-rate');
  rateEl.value = state.settings?.sprinkler_rate_inches_per_hour || 0.5;
  minutesEl.addEventListener('input', () => {
    const mins = parseFloat(minutesEl.value);
    const rate = parseFloat(rateEl.value) || 0.5;
    if (!isNaN(mins)) amountEl.value = ((mins / 60) * rate).toFixed(2);
  });

  document.getElementById('btn-modal-close').addEventListener('click', closeModal);
  document.getElementById('btn-modal-cancel').addEventListener('click', closeModal);
  document.getElementById('modal-backdrop').addEventListener('click', e => { if (e.target.id === 'modal-backdrop') closeModal(); });
  document.getElementById('btn-modal-save').addEventListener('click', saveModal);
  document.getElementById('btn-modal-delete').addEventListener('click', deleteModalEntry);
}

function updateModalTypeButtons() {
  document.querySelectorAll('.modal-type-btn').forEach(btn => {
    const active = btn.dataset.type === modalType;
    btn.className = `modal-type-btn flex-1 py-2.5 rounded-xl font-semibold text-sm ring-1 ${active ? 'bg-emerald-500 text-white ring-emerald-400 shadow-md shadow-emerald-500/25' : 'bg-slate-50 text-slate-600 ring-slate-200'}`;
  });
}

function closeModal() {
  const el = document.getElementById('modal-backdrop');
  if (el) el.remove();
  editingEntry = null;
}

async function saveModal() {
  const amount = parseFloat(document.getElementById('in-amount').value);
  if (isNaN(amount) || amount <= 0) return alert('Enter a valid amount in inches.');
  const notes = document.getElementById('in-notes').value || null;
  const useNow = document.getElementById('in-use-now').checked;
  const createdAt = useNow ? new Date() : new Date(document.getElementById('in-timestamp').value);
  if (isNaN(createdAt.getTime())) return alert('Enter a valid date/time.');

  const payload = { type: modalType, amount_inches: amount, notes, created_at: createdAt.toISOString() };

  const { error } = editingEntry
    ? await supabase.from('water_logs').update(payload).eq('id', editingEntry.id)
    : await supabase.from('water_logs').insert(payload);

  if (error) return alert('Save failed: ' + error.message);
  closeModal();
  await refreshAll();
}

async function deleteModalEntry() {
  if (!editingEntry) return;
  if (!confirm('Delete this entry? This cannot be undone.')) return;
  const { error } = await supabase.from('water_logs').delete().eq('id', editingEntry.id);
  if (error) return alert('Delete failed: ' + error.message);
  closeModal();
  await refreshAll();
}

// ---------------------------------------------------------------------
// Orchestration
// ---------------------------------------------------------------------
function renderConfigError(message) {
  root.innerHTML = `<div class="flex-1 flex flex-col items-center justify-center text-center gap-3 px-4">
    <div class="text-4xl">⚠️</div>
    <h1 class="text-lg font-bold text-slate-900">Setup Needed</h1>
    <p class="text-slate-500 text-sm">${message}</p>
  </div>`;
}

async function refreshAll() {
  if (NOT_CONFIGURED) {
    renderConfigError('Paste your Supabase URL and anon key into the SUPABASE_URL / SUPABASE_ANON_KEY constants near the top of the &lt;script&gt; in index.html, then reload.');
    return;
  }

  let settings;
  try {
    settings = state.settings || await loadSettings();
  } catch (e) {
    console.error(e);
    renderConfigError('Could not reach Supabase. Double-check your SUPABASE_URL / SUPABASE_ANON_KEY and that schema.sql has been run, then reload.');
    return;
  }
  if (!settings) { renderSetup(null); return; }
  state.settings = settings;

  renderApp();

  try {
    const [weather, logs, alerts] = await Promise.all([
      fetchWeather(settings.latitude, settings.longitude),
      loadLogs(),
      loadRecentAlerts(),
    ]);
    state.weather = weather;
    state.logs = logs;
    state.alerts = alerts;

    const todayIdx = getTodayIdx(weather);
    const phaseInfo = getPhase(settings);
    const metrics = computeMetrics(settings, weather, logs, todayIdx);
    const schedule = computeSchedule(settings, phaseInfo, weather, logs);
    state.schedule = schedule;
    const status = computeStatus(settings, phaseInfo, metrics, schedule);

    renderDashboard(settings, phaseInfo, metrics, status, schedule);
    renderMoistureGauge(schedule);
    renderCurrentConditions(weather);
    renderForecastStrip(weather, todayIdx);
    renderMoistureChart(weather, logs, todayIdx);
    renderNotifications(buildNotifications(settings, phaseInfo, metrics, status, alerts, weather, todayIdx, schedule));
    renderHistory(logs);
    maybeNotify(status);
  } catch (e) {
    console.error(e);
    const cards = document.getElementById('dashboard-cards');
    if (cards) cards.innerHTML = '<div class="card rounded-3xl p-4 text-sm text-red-600">Weather data unavailable — check your connection.</div>';
  }
}

function maybeNotify(status) {
  if (!NOTIFIABLE_KEYS.has(status.key)) return;
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const today = new Date().toDateString();
  const lastKey = localStorage.getItem('lastNotifiedStatusKey');
  const lastDate = localStorage.getItem('lastNotifiedDate');
  if (lastKey === status.key && lastDate === today) return;
  const meta = STATUS_META[status.key];
  new Notification(`${meta.emoji} ${meta.label}`, { body: status.detail });
  localStorage.setItem('lastNotifiedStatusKey', status.key);
  localStorage.setItem('lastNotifiedDate', today);
}

refreshAll();
setInterval(refreshAll, 15 * 60 * 1000);
// Ticks the gauge/next-due display between full refreshes using cached data — no network calls.
setInterval(() => { if (state.schedule) renderMoistureGauge(state.schedule); }, 60 * 1000);
</script>
